<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Block Idle</title>
    <style>
      :root {
        --page: #f1ece4;
        --card: #fbf8f3;
        --line: #ddd3c6;
        --muted: #71665a;
        --ink: #2f261d;
        --dirt: #7b5034;
        --dirt-hover: #5f3b25;
        --wood: #a97843;
        --stone: #ddd6cc;
      }
      :root[data-theme="dark"], :root:not([data-theme="light"]) {
        color-scheme: dark;
      }
      :root[data-theme="dark"] {
        --page: #1c1b19;
        --card: #292724;
        --line: #464139;
        --muted: #b4aa9e;
        --ink: #f1ece4;
        --dirt: #8f6242;
        --dirt-hover: #a97853;
        --wood: #c99458;
        --stone: #514d46;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #1c1b19;
          --card: #292724;
          --line: #464139;
          --muted: #b4aa9e;
          --ink: #f1ece4;
          --dirt: #8f6242;
          --dirt-hover: #a97853;
          --wood: #c99458;
          --stone: #514d46;
        }
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 1rem 1rem 6rem;
      }
      nav[role="tablist"] {
        position: fixed;
        z-index: 1;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        justify-content: center;
        gap: 0.25rem;
        padding: 0.5rem;
        background: var(--card);
        border-top: 1px solid var(--line);
      }
      nav[role="tablist"] button {
        flex: 1;
        min-width: 0;
      }
      nav[role="tablist"] button[aria-selected="true"] {
        background: var(--dirt-hover);
      }
      @media (min-width: 40rem) {
        main { padding-bottom: 1rem; }
        nav[role="tablist"] {
          position: static;
          max-width: 36rem;
          margin: 0 auto;
          border: 0;
          background: transparent;
        }
      }
      h2 {
        font-size: 1rem;
        color: var(--muted);
      }
      ul {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 0.5rem;
        padding: 0;
        list-style: none;
      }
      li {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 0.5rem;
      }
      li > :first-child {
        flex: 1;
      }
      .name {
        font-weight: 600;
      }
      .amount {
        font-variant-numeric: tabular-nums;
      }
      .details {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .details .name ~ span {
        font-size: 0.875rem;
        color: var(--muted);
      }
      button {
        min-width: 5.5rem;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: var(--dirt);
        color: var(--card);
        font: inherit;
      }
      button:hover {
        background: var(--dirt-hover);
      }
      button:focus-visible {
        outline: 3px solid var(--wood);
        outline-offset: 2px;
      }
      button:disabled {
        background: var(--stone);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Block Idle</h1>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
